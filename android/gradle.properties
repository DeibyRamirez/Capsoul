org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Plantilla Flutter: mantener en false hasta que plugins (firebase_core, share_plus, etc.)
# soporten built-in Kotlin de AGP 9 (ver docs Flutter migrate-to-built-in-kotlin).
android.newDsl=false
android.builtInKotlin=false
# Disable Kotlin incremental compilation to avoid cross-drive path errors on Windows
# (project on D: vs Pub cache on C:).
kotlin.incremental=false
org.gradle.parallel=false
