# Compilacion de artefactos de Capsoul (Android APK/AAB e iOS .ipa sin firmar).
# Se ejecuta a mano (workflow_dispatch) y en cada push a main.
# Los secretos se leen como variables de entorno y nunca se imprimen en el log.
name: Build Capsoul

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Si llega otro push a main mientras compila, se cancela la ejecucion anterior.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mismo canal que ci.yml (stable, sin version fija). Si se fija una version
  # en ci.yml, fijar la misma aqui (la local del equipo es 3.47.2).
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Crea env/dev.json (ignorado por git) desde los secretos, sin hacer echo.
      # jq lee los valores del entorno, no de la linea de comandos.
      - name: Crear env/dev.json desde secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BACKEND: ${{ secrets.BACKEND }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY."
            exit 1
          fi
          # Nunca se deben compilar claves privilegiadas dentro de la app.
          case "${SUPABASE_ANON_KEY}" in
            sbp_*|sb_secret_*)
              echo "::error::SUPABASE_ANON_KEY parece un token privado (sbp_/sb_secret_). Usa la anon/publishable key."
              exit 1 ;;
          esac
          mkdir -p env
          jq -n '{
              SUPABASE_URL: env.SUPABASE_URL,
              SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY,
              API_BASE_URL: env.API_BASE_URL,
              BACKEND: env.BACKEND
            } | with_entries(select(.value != null and .value != ""))' > env/dev.json
          echo "env/dev.json creado con las claves: $(jq -r 'keys | join(", ")' env/dev.json)"

      # Firma de release: si existe ANDROID_KEYSTORE_BASE64 se decodifica el
      # keystore y se genera android/key.properties (ambos en .gitignore).
      # Si no, se avisa y se compila con la firma debug.
      - name: Configurar firma Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::warning::No hay secreto ANDROID_KEYSTORE_BASE64: el APK/AAB de release se firma con la clave debug (no apto para Play Store)."
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 existe pero falta ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS o ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          # storeFile es relativo a android/app (donde se evalua build.gradle.kts).
          {
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
          if ! grep -q "key.properties" android/app/build.gradle.kts; then
            echo "::warning::android/app/build.gradle.kts aun no lee key.properties: el release seguira firmado con debug (ver cambios_necesarios.md)."
          fi
          echo "Keystore y key.properties preparados."

      - name: Dependencias
        run: flutter pub get

      - name: APK release
        run: flutter build apk --release --dart-define-from-file=env/dev.json

      - name: AAB release
        run: flutter build appbundle --release --dart-define-from-file=env/dev.json

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: capsoul-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Subir AAB
        uses: actions/upload-artifact@v4
        with:
          name: capsoul-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      # Limpieza defensiva del material sensible (el runner es efimero igualmente).
      - name: Limpiar secretos
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks env/dev.json

  ios:
    name: iOS (.ipa sin firmar)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Crear env/dev.json desde secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BACKEND: ${{ secrets.BACKEND }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY."
            exit 1
          fi
          case "${SUPABASE_ANON_KEY}" in
            sbp_*|sb_secret_*)
              echo "::error::SUPABASE_ANON_KEY parece un token privado (sbp_/sb_secret_). Usa la anon/publishable key."
              exit 1 ;;
          esac
          mkdir -p env
          jq -n '{
              SUPABASE_URL: env.SUPABASE_URL,
              SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY,
              API_BASE_URL: env.API_BASE_URL,
              BACKEND: env.BACKEND
            } | with_entries(select(.value != null and .value != ""))' > env/dev.json
          echo "env/dev.json creado con las claves: $(jq -r 'keys | join(", ")' env/dev.json)"

      # GoogleService-Info.plist no esta en git. La app inicializa Firebase con
      # lib/firebase_options.dart (incluye config iOS), asi que es opcional.
      # Nota: para que el plist entre al bundle debe estar referenciado en
      # Runner.xcodeproj; si no lo esta, este paso solo lo deja en disco.
      - name: GoogleService-Info.plist (opcional)
        env:
          IOS_GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${IOS_GOOGLE_SERVICE_INFO_BASE64}" ]; then
            printf '%s' "${IOS_GOOGLE_SERVICE_INFO_BASE64}" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist decodificado."
          elif [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            echo "::notice::Sin GoogleService-Info.plist; Firebase usa DefaultFirebaseOptions.ios."
          fi

      - name: Dependencias
        run: flutter pub get

      # flutter build ios genera el Podfile si no existe y ejecuta pod install.
      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign --dart-define-from-file=env/dev.json

      - name: Empaquetar .ipa sin firmar
        run: |
          set -euo pipefail
          rm -rf Payload capsoul-sin-firmar.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry capsoul-sin-firmar.ipa Payload
          ls -lh capsoul-sin-firmar.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: capsoul-ios-sin-firmar
          path: capsoul-sin-firmar.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Limpiar secretos
        if: always()
        run: rm -f env/dev.json ios/Runner/GoogleService-Info.plist
