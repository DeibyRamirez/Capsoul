name: CI Capsoul

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Compila el APK debug en cada PR y en develop/main. Atrapa referencias
  # Kotlin sin dependencia (p. ej. firebase-messaging) que analyze y test no ven.
  # Sin secretos: no firma release ni inyecta dart-define.
  android:
    name: Android (APK debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El runner trae el SDK, pero sin licencias Gradle no descarga
      # platform ni NDK cuando faltan (compileSdk 36, NDK de Flutter).
      - name: Licencias del SDK de Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::El runner no expone ANDROID_SDK_ROOT ni ANDROID_HOME."
            exit 1
          fi
          tool="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$tool" ]; then
            echo "::error::No está sdkmanager en $SDK."
            exit 1
          fi
          yes | "$tool" --sdk_root="$SDK" --licenses >/dev/null || true
          echo "SDK de Android: $SDK"

      - name: Dependencias
        run: flutter pub get

      - name: APK debug
        run: flutter build apk --debug

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      # Las pruebas comparan las firmas con el SDK npm de Cloudinary, que lee estas variables
      # de entorno al importarse; solo se conceden esas (no hay secretos en CI).
      - run: deno test --allow-env=CLOUDINARY_URL,CLOUDINARY_ACCOUNT_URL,CLOUDINARY_API_PROXY supabase/functions/firmar-medio/
      - run: deno test supabase/functions/firmar-subida/
      - run: deno test supabase/functions/buscar-musica/
      - run: deno test supabase/functions/enviar-avisos/

  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Postgres local
        run: bash supabase/pruebas/preparar_entorno_sql.sh
      - name: Migraciones y aserciones
        run: bash supabase/pruebas/ejecutar.sh
